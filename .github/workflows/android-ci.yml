name: Android CI

on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain report
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Unit tests (JVM)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK=$APK"
          ls -l "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "using build-tools $BT"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | head -25
          unzip -l "$APK" | grep -E "lib/|classes.dex" | head -20
          echo "--- zipalign check ---"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -v 4 "$APK" | tail -3
          echo "--- apksigner verify ---"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vz-network-booster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      # Publishes the built APK + build facts to the branch so the artifact is
      # reachable without the Actions artifact API. `[skip ci]` prevents a loop.
      - name: Publish APK and build facts
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" dist/vz-network-booster-debug.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          {
            echo "# VZ Network Booster — debug build facts"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- apk: $(basename "$APK")"
            echo "- size: $(stat -c%s "$APK") bytes"
            echo "- sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "- build-tools used for inspection: $BT"
            echo
            echo "## aapt2 badging"
            echo '```'
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | head -30
            echo '```'
            echo
            echo "## dex + native libraries inside the APK"
            echo '```'
            unzip -l "$APK" | grep -E "lib/|classes.*dex" || true
            echo '```'
            echo
            echo "## services declared in the merged manifest"
            echo '```'
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump xmltree "$ANDROID_HOME"/../noop 2>/dev/null || true
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "E: service|E: activity|GoBackend|BIND_VPN_SERVICE|foregroundServiceType|specialUse" | head -20
            echo '```'
            echo
            echo "## signature and alignment"
            echo '```'
            "$ANDROID_HOME/build-tools/$BT/zipalign" -c 4 "$APK" && echo "zipalign: OK"
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | head -6
            echo '```'
            echo
            echo "## JVM unit test results"
            echo '```'
            find app/build/test-results -name '*.xml' -exec grep -h "<testsuite " {} \; | sed 's/ timestamp.*//' || true
            echo '```'
          } > dist/build-info.txt
          git config user.name "vz-ci"
          git config user.email "vz-ci@users.noreply.github.com"
          git add -f dist/vz-network-booster-debug.apk dist/build-info.txt
          git commit -m "build: publish debug APK [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      # The agent that maintains this repo cannot download run logs from this
      # sandbox, so on failure the tail of the build log is committed back to the
      # branch (with [skip ci] to avoid a loop). Remove this step if you don't want it.
      - name: Publish failure log to branch
        if: failure()
        run: |
          mkdir -p ci
          tail -c 400000 build.log > ci/last-build.log || echo "no log captured" > ci/last-build.log
          git config user.name "vz-ci"
          git config user.email "vz-ci@users.noreply.github.com"
          git add -f ci/last-build.log
          git commit -m "ci: build log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
