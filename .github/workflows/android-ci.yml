name: Android CI

on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain report
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Unit tests (JVM)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK=$APK"
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -20 || \
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vz-network-booster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
