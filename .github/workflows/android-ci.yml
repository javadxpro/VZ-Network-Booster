name: Android CI

on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Toolchain report
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Unit tests (JVM)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK=$APK"
          ls -l "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "using build-tools $BT"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | head -25
          unzip -l "$APK" | grep -E "lib/|classes.dex" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vz-network-booster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      # The agent that maintains this repo cannot download run logs from this
      # sandbox, so on failure the tail of the build log is committed back to the
      # branch (with [skip ci] to avoid a loop). Remove this step if you don't want it.
      - name: Publish failure log to branch
        if: failure()
        run: |
          mkdir -p ci
          tail -c 400000 build.log > ci/last-build.log || echo "no log captured" > ci/last-build.log
          git config user.name "vz-ci"
          git config user.email "vz-ci@users.noreply.github.com"
          git add -f ci/last-build.log
          git commit -m "ci: build log [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
